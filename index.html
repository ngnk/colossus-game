<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colossus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>

:root{
  --bg:#14122B; --panel:#1D1A3A; --panel2:#241F45; --line:#3A3663; --ink:#F5F2EA; --muted:#B9B4D6;
  --paper:#FBF8F1; --paper-ink:#1C1830; --amber:#F4B740; --amber-ink:#1A1405; --gold:#FFD27A; --good:#4ADE80; --bad:#F87171;
  --display:'Bricolage Grotesque', Figtree, system-ui, sans-serif; --body:Figtree, system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:14px;font-size:12px;font-weight:800;letter-spacing:.12em}
.chip.amber{background:var(--amber);color:var(--amber-ink)}
.chip.dark{background:#14122BCC;color:var(--ink);letter-spacing:.02em;font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:26px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:800;font-size:17px}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.good{background:#123B26;color:var(--good);border-color:var(--good)}
.portrait{display:inline-block;line-height:0}
.portrait svg,.portrait img{display:block}
.muted{color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

:root{color-scheme:dark}
body.host{padding:12px 16px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 6px}
.hostframe{width:100%;overflow:hidden;border-radius:16px;background:var(--bg)}
.hostscale{width:1280px;height:720px;transform-origin:0 0;position:relative;overflow:auto}
.hostapp{position:relative;min-height:720px}
.phones{display:flex;gap:16px;overflow-x:auto;padding:10px 0 6px}
.phonewrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.phonebox{width:390px;height:780px;border-radius:30px;border:3px solid #3A3663;overflow:hidden;background:var(--bg);position:relative}
.phoneapp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
body.phone .phoneapp{position:relative;inset:auto;min-height:100vh;min-height:100dvh;overflow:visible}
.addbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addbar button{min-height:40px;padding:0 14px;border-radius:20px;border:2px solid var(--line);background:var(--panel);font-weight:700}
.still *{animation:none!important}
.phoneapp .app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.phoneapp .stage{position:relative;height:400px;overflow:hidden;flex:none}
.phoneapp .stage .bg{position:absolute;inset:0}
.phoneapp .stage .fade{position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(transparent,var(--bg))}
.phoneapp .topbar{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.phoneapp .dot{width:20px;height:20px;border-radius:10px;display:inline-block;flex:none}
.phoneapp .roundchip{position:absolute;left:0;right:0;top:calc(56px + env(safe-area-inset-top));display:flex;justify-content:center;z-index:2}
.phoneapp .speaker{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);z-index:1;animation:rise .45s ease both;filter:drop-shadow(0 10px 18px #0008)}
.phoneapp .dialog{position:relative;margin:-56px 12px 0;z-index:3;background:var(--panel);border:3px solid var(--tagc,#F4B740);border-radius:22px;padding:24px 18px 16px;box-shadow:0 12px 30px #0007;animation:pop .3s ease both}
.phoneapp .nametag{position:absolute;left:14px;top:-18px;display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:18px;font-weight:800;font-size:13px;letter-spacing:.1em}
.phoneapp .nametag .mini{width:28px;height:28px;border-radius:14px;overflow:hidden;background:#14122B;display:flex;align-items:flex-start;justify-content:center}
.phoneapp .dialog p{margin:0;font-size:18px;line-height:1.4;font-weight:600}
.phoneapp .dialog p.narr{font-style:italic;font-weight:500;color:#E6E1F5}
.phoneapp .choices{display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding:16px 12px 6px}
.phoneapp .choice{display:flex;align-items:center;gap:12px;max-width:94%;min-height:50px;padding:10px 12px 10px 18px;border-radius:22px;background:#221E46;border:2px solid #5A5490;color:var(--ink);font-size:16px;font-weight:700;text-align:left;animation:rise .35s ease both}
.phoneapp .choice:nth-child(2){animation-delay:.06s}
.phoneapp .choice:nth-child(3){animation-delay:.12s}
.phoneapp .choice .k{flex:none;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#14122B;border:2px solid #7C76B8;font-size:13px;font-weight:800}
.phoneapp .choice.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.phoneapp .choice.on .k{background:var(--amber-ink);color:var(--amber);border-color:var(--amber-ink)}
.phoneapp .panel{margin:10px 12px 0;padding:12px;border-radius:18px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.phoneapp .panel .h{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--gold);display:flex;align-items:center;gap:6px}
.phoneapp .row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:8px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);width:100%;text-align:left}
.phoneapp .row.on{border-color:var(--amber)}
.phoneapp .row small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.phoneapp .pill{flex:none;min-width:44px;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:800;text-align:center;background:#3A3663;color:var(--muted)}
.phoneapp .pill.on{background:var(--amber);color:var(--amber-ink)}
.phoneapp textarea{width:100%;min-height:64px;border-radius:12px;border:1px solid var(--line);background:#14122B;color:var(--ink);font:inherit;padding:10px;resize:vertical}
.phoneapp .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phoneapp .seg button{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);font-weight:700}
.phoneapp .seg button.on{border-color:var(--amber);background:var(--amber);color:var(--amber-ink)}
.phoneapp .bottom{position:sticky;bottom:0;margin-top:auto;padding:14px 12px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;flex-direction:column;gap:8px;z-index:5}
.phoneapp .status{text-align:center;font-size:14px;color:var(--muted)}
.phoneapp .wrap{padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.phoneapp .card{background:var(--panel);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.phoneapp .cast{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:6px 14px 6px 6px;border-radius:18px;background:var(--panel);border:2px solid var(--line);text-align:left}
.phoneapp .cast .face{width:56px;height:56px;border-radius:28px;overflow:hidden;flex:none;display:flex;align-items:flex-start;justify-content:center}
.phoneapp .cast .t{flex:1;display:flex;flex-direction:column}
.phoneapp .cast .t b{font-size:16px}
.phoneapp .cast .t span{font-size:13px;color:var(--muted)}
.phoneapp input[type=text]{width:100%;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:17px;padding:0 14px}
.phoneapp .overlay{position:absolute;inset:0;background:#0D0B1CF2;z-index:20;display:flex;justify-content:center;overflow:auto}
.phoneapp .overlay .inner{max-width:480px;width:100%;padding:24px 16px;display:flex;flex-direction:column;gap:14px;animation:pop .25s ease both}
.phoneapp .bubble{background:#2A2552;border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:16px;line-height:1.4}
.phoneapp .receipt{background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.phoneapp .verdict{padding:5px 10px;border-radius:10px;font-size:12px;font-weight:800;letter-spacing:.08em}
.phoneapp .verdict.win{background:var(--good);color:#0B2A17}
.phoneapp .verdict.partial{background:var(--amber);color:var(--amber-ink)}
.phoneapp .verdict.loss{background:var(--bad);color:#2A0B0B}
.phoneapp .err{position:absolute;left:12px;right:12px;bottom:90px;z-index:30;background:#3A1D24;border:1px solid var(--bad);border-radius:14px;padding:12px;text-align:center}
.phoneapp .still *{animation:none!important}
.hostapp .app{min-height:720px;display:flex;flex-direction:column}
.hostapp .screen{flex:1;padding:36px 48px 96px;display:flex;flex-direction:column;gap:22px;animation:rise .4s ease both}
.hostapp .controls{position:absolute;right:20px;bottom:20px;display:flex;gap:10px;z-index:10;padding:8px;border-radius:32px;background:#14122BE6}
.hostapp .controls .btn{min-height:48px;font-size:16px}
.hostapp .banner{position:relative;height:220px;border-radius:24px;overflow:hidden;flex:none}
.hostapp .banner .bg{position:absolute;top:0;bottom:0;right:0;width:min(560px,48%)}
.hostapp .banner{background:#1D1A3A}
.hostapp .banner .txt{position:absolute;left:28px;right:28px;bottom:22px;display:flex;flex-direction:column;gap:8px}
.hostapp .banner .shade{position:absolute;inset:0;background:linear-gradient(90deg,#1D1A3A 0%,#1D1A3A 48%,#1D1A3A00 72%)}
.hostapp .grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.hostapp .tile{background:var(--panel);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;border:3px solid transparent;text-align:center}
.hostapp .tile .face{width:120px;height:120px;border-radius:60px;overflow:hidden;display:flex;align-items:flex-start;justify-content:center}
.hostapp .tile.locked{border-color:var(--good)}
.hostapp .tag{padding:4px 12px;border-radius:12px;font-size:13px;font-weight:800;letter-spacing:.06em}
.hostapp .say{background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:14px 16px;font-size:19px;font-weight:700;line-height:1.3;width:100%;min-height:92px;text-align:left;animation:pop .4s ease both}
.hostapp .notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.hostapp .note{background:var(--panel);border-radius:16px;padding:14px 16px;font-size:18px;line-height:1.35;animation:rise .4s ease both}
.hostapp .note.big{background:#3A1D24;border:1px solid var(--bad)}
.hostapp .note b{display:block;font-size:13px;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.hostapp .boardstrip{display:flex;flex-wrap:wrap;gap:10px}
.hostapp .boardstrip span{padding:8px 14px;border-radius:12px;background:var(--panel);font-size:16px}
.hostapp .blocks{display:inline-flex;gap:4px;vertical-align:middle;margin:0 6px}
.hostapp .blocks i{width:18px;height:12px;border-radius:3px;background:var(--line);display:inline-block}
.hostapp .blocks i.on{background:#A78BFA}
.hostapp table{width:100%;border-collapse:collapse;font-size:19px}
.hostapp th{text-align:left;color:var(--muted);font-size:14px;padding:0 14px 10px 0}
.hostapp td{padding:12px 14px 12px 0;border-top:1px solid #2E2A55;vertical-align:top}
.hostapp .verdict{padding:5px 10px;border-radius:10px;font-size:13px;font-weight:800;letter-spacing:.08em;white-space:nowrap}
.hostapp .verdict.win{background:var(--good);color:#0B2A17}
.hostapp .verdict.partial{background:var(--amber);color:var(--amber-ink)}
.hostapp .verdict.loss{background:var(--bad);color:#2A0B0B}
.hostapp .big-title{font-size:clamp(48px,6vw,88px);font-weight:800;letter-spacing:-.02em}
.hostapp #timer{font-family:var(--display);font-size:64px;font-weight:800;color:var(--gold)}
.hostapp .still *{animation:none!important}
</style>
</head>

<script>
// Colossus: rules engine. Pure functions, no DOM. Used by the host server and the simulator.
// 5 characters (2 players each) · 4 rounds · 3 choice cards per character per round · toggle powers.

const CHARS = ['musk', 'mayor', 'residents', 'business', 'regulators'];
const NAMES = { musk: 'Musk / xAI', mayor: 'Mayor', residents: 'Residents', business: 'Local Businesses', regulators: 'Regulators' };

const PROTECTIONS = {
  hiring:     { label: 'Local hiring commitment', kind: 'econ' },
  rates:      { label: 'xAI pays grid upgrades (no rate shift)', kind: 'econ' },
  permits:    { label: 'Air permits with monitoring', kind: 'env' },
  health:     { label: 'Community health fund', kind: 'health' },
  decree:     { label: 'Consent decree: emission controls and health fund', kind: 'env' },
};

// Each card: [key, line the character says, action]
const ROUNDS = [
  { id: 'announce', title: 'The Announcement', when: 'June 2024',
    scene: 'The Chamber announces a "Gigafactory of Compute." The council finds out from the evening news. The location is secret.',
    cards: {
      musk:       [['A','Announce first. Explain never.','secret'], ['B','Promise them 300 jobs.','offer:hiring'], ['C','Fine. Brief the council first.','brief']],
      mayor:      [['A','Get me next to Elon at the podium.','fasttrack'], ['B','No celebrating until I see terms.','lock'], ['C','Sign the NDAs. We say nothing.','nda']],
      residents:  [['A','Pack the council meeting.','mobilize'], ['B','Start logging the smoke and noise.','document'], ['C','Let\'s see what they promise.','wait']],
      business:   [['A','Two biggest supercomputers, times four!','hype'], ['B','What\'s in it for local suppliers?','bargain'], ['C','Stay out of the photo op.','neutral']],
      regulators: [['A','Not our jurisdiction.','pass'], ['B','Open an investigation.','investigate'], ['C','No operation without air permits.','conditional']],
    },
    prompts: ['What here is a problem even if it is legal?', 'What would a responsible process have looked like in this community?'] },
  { id: 'power', title: 'The Power Gap', when: 'August 2024',
    scene: 'The grid can only supply a third of the power Colossus needs. Grid upgrades take years. Gas turbines are on trucks outside.',
    cards: {
      musk:       [['A','Roll in the turbines. Permits later.','turbines'], ['B','We\'ll pay for the grid upgrade ourselves.','grid+offer:rates'], ['C','Turbines, but with permits.','turbines_permitted']],
      mayor:      [['A','Approve the grid. Ratepayers share the cost.','grid_ratepayers'], ['B','Grid hookup only if xAI pays.','grid_xai'], ['C','No approvals until permits exist.','withhold']],
      residents:  [['A','Force a public hearing.','mobilize'], ['B','Log every asthma attack.','document'], ['C','If they offer something, we take it.','accept']],
      business:   [['A','Bid for the construction contracts.','hype'], ['B','Local hiring, in writing, or no support.','bargain'], ['C','Fight any rate hike.','lobby']],
      regulators: [['A','They\'re mobile. They\'re exempt.','pass'], ['B','Inspect those turbines.','investigate'], ['C','Stop Work.','stop']],
    },
    prompts: ['Whose job should it be to collect evidence that the turbines cause harm?', 'Who actually did that work, here and in the real case?'] },
  { id: 'stateline', title: 'Across the State Line', when: '2025 to 2026',
    scene: 'This really happened: for its second data center, xAI put 57 gas turbines in Southaven, Mississippi, a mile from the Memphis site. Memphis has no authority there, and Memphis residents can\'t vote in Mississippi.',
    cards: {
      musk:       [['A','Move the turbines to Mississippi.','relocate'], ['B','Switch to grid power.','grid'], ['C','Offer a health fund. Our terms.','offer:health']],
      mayor:      [['A','Let Mississippi deal with it.','pass'], ['B','Every promise goes in writing.','lock'], ['C','City money for a health clinic.','purse']],
      residents:  [['A','Pack City Hall again.','mobilize'], ['B','Document the smoke from across the line.','document'], ['C','Take xAI\'s money.','accept']],
      business:   [['A','Follow the money to Mississippi.','follow'], ['B','Our customers breathe this. Back the residents.','backres'], ['C','Local purchasing, in writing.','bargain']],
      regulators: [['A','Refer it to Mississippi.','pass'], ['B','Investigate.','investigate'], ['C','Stop Work.','stop']],
    },
    prompts: ['This community already fails air-quality standards. Should it take less evidence to act here?', 'The pollution crossed the state line. Did accountability cross with it?'] },
  { id: 'lawsuit', title: 'The Lawsuit and the Deal', when: 'April to June 2026',
    scene: 'Civil rights groups sue. Washington says the turbines matter for national security. The final deal goes to a vote.',
    cards: {
      musk:       [['A','Fight it and keep running.','fight'], ['B','Settle: controls and a health fund.','offer:decree'], ['C','Pull the turbines. Grid only.','grid']],
      mayor:      [['A','Approve the deal.','approve'], ['B','Binding terms or no deal.','approve_if2+lock'], ['C','Withhold approval.','withhold']],
      residents:  [['A','We endorse.','endorse'], ['B','We withdraw support.','withdraw'], ['C','Endorse only if it\'s in writing.','endorse_if2']],
      business:   [['A','Endorse.','endorse'], ['B','Oppose.','oppose'], ['C','Endorse only with written hiring.','endorse_ifhiring']],
      regulators: [['A','Wave it through.','approve_plain'], ['B','Approve, with conditions in a consent decree.','conditional_approve+lock'], ['C','Stop Work.','stop']],
    },
    prompts: ['What would a fair process for a data center like this look like?', 'What would you need to see to know the harms and benefits were fairly shared?'] },
];

const BUILD_TARGET = 6;

function newGame() {
  return {
    round: 1, build: 0, builtByR3: false,
    turbines: null, permitted: false, violations: [],
    gridApproved: false, ratepayers: false, secrecy: false, relocated: false, businessFollowed: false,
    conditional: false, investigations: [], confirmedRound: null, documented: [],
    stop: null,            // {issued, activeFrom, delayed, lifted}
    unsupportedStop: false,
    air: { memphis: 0, southaven: 0 },
    protections: [],       // {id, round, paidBy}
    tokens: { mobilize: 2, investigate: 2, stop: 1, delay: 1, fasttrack: 1, relocate: 1, endorse: 1 },
    donation: null,        // {round, response:'accept'|'decline'|'whistle', exposedRound}
    final: null, history: [], over: false,
  };
}

// Which cards are playable this round (powers with uses / preconditions)
function available(g, ch, action) {
  const t = g.tokens;
  if (action === 'mobilize') return t.mobilize > 0;
  if (action === 'investigate') return t.investigate > 0;
  if (action === 'stop') return t.stop > 0 && g.confirmedRound !== null && !g.stop;
  if (action === 'fasttrack') return t.fasttrack > 0;
  if (action === 'relocate') return t.relocate > 0;
  return true;
}
const canOverride = g => g.tokens.delay > 0 && g.round === ROUNDS.length;
const canDelay = g => g.tokens.delay > 0 && g.stop && !g.stop.delayed && !g.stop.lifted && g.stop.activeFrom >= g.round;

function stopActive(g, r) { return g.stop && !g.stop.lifted && r >= g.stop.activeFrom; }
function has(g, id) { return g.protections.some(p => p.id === id); }
function addProt(g, id, paidBy, notes, who) {
  if (has(g, id)) return false;
  g.protections.push({ id, round: g.round, paidBy });
  notes.push({ who, text: `Written into the agreement: ${PROTECTIONS[id].label}${paidBy === 'taxpayers' ? ' (paid by taxpayers)' : ''}.`, big: true });
  return true;
}

// picks: {musk:'A'|'B'|'C', ...}; toggles: {delay:bool}
function resolveRound(g, picks, toggles = {}) {
  const r = g.round, R = ROUNDS[r - 1], notes = [];
  const card = ch => { const k = picks[ch]; const c = R.cards[ch].find(x => x[0] === k); return c ? { key: c[0], line: c[1], action: c[2] } : null; };
  const C = Object.fromEntries(CHARS.map(ch => [ch, card(ch)]));
  const act = ch => (C[ch] ? C[ch].action : 'none');
  const says = ch => C[ch] && notes.push({ who: NAMES[ch], text: `"${C[ch].line}"`, quote: true });
  CHARS.forEach(says);

  const before = { build: g.build, air: { ...g.air }, protections: g.protections.length };

  // 0. Delay Enforcement (toggle)
  if (toggles.delay && canDelay(g)) { g.tokens.delay--; g.stop.activeFrom++; g.stop.delayed = true;
    notes.push({ who: NAMES.musk, text: 'Calls Washington. The Stop Work order is pushed back one round.', big: true }); }
  // 0b. Secret channel: Musk privately offers the Mayor a campaign donation (once, Rounds 1-3). Hidden from the room.
  if (toggles.donate && !g.donation && r < ROUNDS.length) {
    const resp = toggles.mayorResponse || 'decline';
    g.donation = { round: r, response: resp, exposedRound: null };
    if (resp === 'accept') notes.push({ who: 'Secret channel', text: 'Musk sends a campaign donation. The Mayor accepts.', secret: true });
    if (resp === 'decline') notes.push({ who: 'Secret channel', text: 'Musk offers a campaign donation. The Mayor quietly declines.', secret: true });
    if (resp === 'whistle') { g.tokens.delay = 0;
      notes.push({ who: NAMES.mayor, text: 'Goes public: Musk tried to buy approval with a campaign donation. Washington stops taking his calls (Call Washington is lost).', big: true });
      g.whistled = r; notes.push({ who: NAMES.musk, tweet: true, text: 'The Mayor of Memphis is a total clown who just cost his city billions. And the "activists" would rather have smog-free unemployment than the future. Unreal.' }); }
  }
  // 0c. Capital fights back (once per game), from the round after Musk is first blocked or exposed.
  // Each card mirrors a documented move by a company or billionaire when local politics went against it.
  if (toggles.retaliate && g.crashout && !g.crashout.used && r > g.crashout.round) {
    const k = toggles.retaliate; g.crashout.used = k;
    if (k === 'sue') { g.suedThrough = ROUNDS.length;
      notes.push({ who: NAMES.musk, tweet: true, text: 'We are suing the City of Memphis. Unconstitutional. See you in court.' });
      notes.push({ who: NAMES.musk, text: 'Sues the city. The Mayor\'s Withhold is tied up in court for the rest of the game.', big: true }); }
    if (k === 'preempt') { g.preemptedFrom = r + 1;
      notes.push({ who: NAMES.musk, tweet: true, text: 'Great meeting with state leaders today. America cannot let one city block the future of AI.' });
      notes.push({ who: NAMES.musk, text: 'Lobbies the state to override local control. From next round, the Mayor\'s Withhold and Residents\' Mobilize no longer bind.', big: true }); }
    if (k === 'challenger') { g.challenger = true;
      notes.push({ who: NAMES.musk, tweet: true, text: 'Memphis deserves a mayor who builds. Proud to support new leadership.' });
      notes.push({ who: NAMES.musk, text: 'Bankrolls a challenger. The Mayor now needs 4 of 5 to be re-elected.', big: true }); }
    if (k === 'leave') { g.headlinesLost = true; g.investmentPaused = true;
      notes.push({ who: NAMES.musk, tweet: true, text: 'Frankly, this is the final straw. Pausing all Memphis investment. Plenty of states want us.' });
      notes.push({ who: NAMES.musk, text: 'Pauses investment and threatens to leave. The Mayor is blamed for losing billions (loses the investment point) and local contractors lose work.', big: true }); }
  }
  const crashTrigger = (why) => { if (!g.crashout) { g.crashout = { round: r, used: null, why };
    notes.push({ who: NAMES.musk, text: 'Crashes out. From next round, Musk can strike back once: sue, go over their heads to the state, bankroll a challenger, or pause investment.', big: true }); } };
  const halted = stopActive(g, r);
  if (halted) notes.push({ who: 'Stop Work', text: 'Construction and operation are frozen this round.', big: true });

  // 1. Mayor grid and approval posture
  const m = act('mayor');
  const withhold = m === 'withhold';
  if (m === 'grid_ratepayers') { g.gridApproved = true; if (act('business') === 'lobby') { g.ratepayers = false; addProt(g, 'rates', 'xAI', notes, NAMES.business); notes.push({ who: NAMES.business, text: 'Lobbying shifts the upgrade bill from ratepayers to xAI.' }); } else { g.ratepayers = true; notes.push({ who: NAMES.mayor, text: 'Grid approved. Household and business ratepayers share the upgrade cost.' }); } }
  if (m === 'grid_xai') { g.gridApproved = true; g.ratepayers = false; addProt(g, 'rates', 'xAI', notes, NAMES.mayor); }
  if (m === 'nda') { g.secrecy = true; }
  const preempted = g.preemptedFrom && r >= g.preemptedFrom;
  const mobilized = act('residents') === 'mobilize' && !preempted;
  if (act('residents') === 'mobilize' && preempted) notes.push({ who: NAMES.residents, text: 'Pack City Hall, but the state has taken the decision out of the city\'s hands.' });
  if (mobilized) { g.tokens.mobilize--; notes.push({ who: NAMES.residents, text: 'Mobilize: the Mayor must answer residents publicly before approving anything else.', big: true }); }
  const mayorResponds = ['lock', 'withhold', 'grid_xai', 'purse'].includes(m) || m.startsWith('approve_if2');

  // 2. Musk build
  const k = act('musk');
  let gain = 0;
  const memphisBased = !['relocate'].includes(k);
  if (k === 'secret') { gain = 2; g.secrecy = true; }
  if (k === 'brief') { gain = 1; }
  if (k.startsWith('offer')) { gain = 1; }
  if (k === 'turbines') { gain = 3; g.turbines = 'memphis'; g.permitted = false; }
  if (k === 'turbines_permitted') { gain = 2; g.turbines = 'memphis'; g.permitted = true; }
  if (k === 'grid' || k === 'grid+offer:rates') {
    const approved = g.gridApproved || m === 'grid_ratepayers' || m === 'grid_xai';
    gain = approved ? 2 : 1;
    if (approved && g.turbines) { notes.push({ who: NAMES.musk, text: 'Shuts the turbines down and moves onto grid power.' }); g.turbines = null; g.permitted = false; }
    if (!approved) notes.push({ who: NAMES.musk, text: 'Waits on the grid, which has not been approved. Slow progress.' });
  }
  if (k === 'relocate') { g.tokens.relocate--; gain = 3; g.turbines = 'southaven'; g.permitted = false; g.relocated = true; }
  if (k === 'fight') { gain = 2; }
  if (k === 'secret' || m === 'nda') notes.push({ who: 'Secrecy', text: 'Terms are being kept from the public.' });

  if (m === 'fasttrack' && !halted) { g.tokens.fasttrack--; if (mobilized) notes.push({ who: NAMES.mayor, text: 'Tries to fast-track, but the hearing comes first. No speed-up.' }); else { gain += 1; notes.push({ who: NAMES.mayor, text: 'Fast-tracks local approvals.' }); } }
  if (act('business') === 'hype' && !halted) gain += 1;
  if (mobilized && !mayorResponds && gain > 0 && memphisBased) { gain -= 1; notes.push({ who: NAMES.mayor, text: 'Ducks the residents. The required hearing costs xAI a step.' }); }
  if (withhold && preempted) { notes.push({ who: NAMES.mayor, text: 'Tries to withhold approval, but state law now overrides the city.', big: true }); }
  else if (withhold && g.suedThrough && r <= g.suedThrough) { notes.push({ who: NAMES.mayor, text: 'Tries to withhold approval, but the order is tied up in xAI\'s lawsuit.', big: true }); }
  else if (withhold && memphisBased && gain > 0) { notes.push({ who: NAMES.mayor, text: 'Withholds local approval. Memphis construction stalls.', big: true }); gain = 0; }
  if (withhold && !memphisBased) notes.push({ who: NAMES.mayor, text: 'Withholds approval, but the new turbines are in Mississippi, beyond the city\'s reach.', big: true });
  if (halted) gain = 0;
  g.build += gain;
  if (k === 'turbines' || k === 'turbines_permitted' || k === 'relocate') notes.push({ who: NAMES.musk, text: `Turbines running in ${g.turbines === 'southaven' ? 'Southaven, MS' : 'South Memphis'}${g.permitted ? ', under permit' : ' without permits'}.` });

  // 3. Turbines run: pollution and violations (unless frozen)
  if (g.turbines && !halted) {
    if (g.turbines === 'memphis') g.air.memphis += g.permitted ? 1 : 2;
    else { g.air.southaven += 2; g.air.memphis += 1; }
    if (!g.permitted) g.violations.push(r);
  }

  // 4. Offers and locks
  const offer = k.includes('offer:') ? k.split('offer:')[1] : null;
  if (offer) notes.push({ who: NAMES.musk, text: `Public offer on the table: ${PROTECTIONS[offer].label}. Take it or leave it.` });
  const lockers = [];
  if (m === 'lock' || m.includes('+lock')) lockers.push(['mayor', 'any']);
  if (act('residents') === 'accept') lockers.push(['residents', 'any']);
  if (act('business') === 'bargain') lockers.push(['business', 'econ']);
  if (act('business') === 'backres') lockers.push(['business', 'any']);
  if (act('regulators').includes('lock')) lockers.push(['regulators', 'any']);
  if (offer) {
    const l = lockers.find(([, scope]) => scope === 'any' || PROTECTIONS[offer].kind === 'econ');
    if (l) addProt(g, offer, 'xAI', notes, NAMES[l[0]]);
    else notes.push({ who: NAMES.musk, text: 'Nobody put the offer in writing. It stays a promise.' });
  } else if (lockers.length) notes.push({ who: NAMES[lockers[0][0]], text: 'Demands terms in writing. xAI offered nothing to write down.' });
  if (m === 'purse') addProt(g, 'health', 'taxpayers', notes, NAMES.mayor);
  if (act('business') === 'follow') { g.businessFollowed = true; notes.push({ who: NAMES.business, text: 'Chase contracts in Mississippi. Local suppliers lose out.' }); }

  // 5. Regulators
  const rg = act('regulators');
  if (rg === 'conditional' || rg.startsWith('conditional_approve')) { g.conditional = true; }
  if (act('residents') === 'document') { g.documented.push(r); notes.push({ who: NAMES.residents, text: 'Evidence logged. Any investigation now takes one round.' }); }
  if (rg === 'investigate') { g.tokens.investigate--; const fast = g.documented.length > 0; const target = toggles.investigate === 'money' ? 'money' : 'turbines'; g.investigations.push({ start: r, end: fast ? r : r + 1, done: false, target });
    notes.push({ who: NAMES.regulators, text: `Open an investigation into ${target === 'money' ? 'the money behind the deal' : 'the turbines'}. Finding due at the end of Round ${fast ? r : r + 1}.` }); }
  if (rg === 'stop') {
    if (available(g, 'regulators', 'stop')) { g.tokens.stop--; g.stop = { issued: r, activeFrom: r + 1, delayed: false, lifted: false };
      notes.push({ who: NAMES.regulators, text: `Stop Work issued, backed by a confirmed violation. Takes effect Round ${r + 1}.`, big: true }); }
    else { notes.push({ who: NAMES.regulators, text: 'Stop Work refused: no confirmed violation yet.' }); }
  }
  if (rg.startsWith('conditional_approve') && g.stop && !g.stop.lifted) {
    const corrected = !g.violations.includes(r) && !g.violations.includes(r - 1);
    if (corrected) { g.stop.lifted = true; notes.push({ who: NAMES.regulators, text: 'Corrections confirmed. The Stop Work order is lifted.', big: true }); }
    else notes.push({ who: NAMES.regulators, text: 'Violations continued too recently. The stop stays.' });
  }
  if (g.conditional && g.permitted && g.turbines) addProt(g, 'permits', 'xAI', notes, NAMES.regulators);

  // 5b. Capital is blocked or exposed -> Musk crashes out (once)
  if (g.whistled === r) crashTrigger('whistle');
  else if (withhold && !preempted && !(g.suedThrough && r <= g.suedThrough)) crashTrigger('withhold');
  else if (rg === 'stop' && g.stop && g.stop.issued === r) crashTrigger('stop');
  // 6. Investigations conclude
  g.investigations.filter(i => !i.done && i.end === r).forEach(i => { i.done = true;
    if (i.target === 'turbines') {
      if (g.violations.length) { if (g.confirmedRound === null) g.confirmedRound = r; notes.push({ who: 'Finding', text: `Confirmed: unpermitted turbines ran in Round ${g.violations.join(', ')}.`, big: true }); }
      else notes.push({ who: 'Finding', text: 'No turbine violation found.', big: true });
    } else {
      const d = g.donation;
      if (d && d.response === 'accept' && !d.exposedRound) { d.exposedRound = r;
        notes.push({ who: 'Finding', text: `SCANDAL: investigators find Musk's campaign donation to the Mayor, made in Round ${d.round}.`, big: true });
        g.tokens.mobilize += 1; g.tokens.fasttrack = 0;
        notes.push({ who: 'Fallout', text: 'The ethics board opens a case against the Mayor. The bought approval is void, Fast Track is revoked, and Residents get an extra Mobilize.', big: true });
        notes.push({ who: NAMES.musk, text: 'xAI declines to comment. No action is taken against the company.' }); }
      else notes.push({ who: 'Finding', text: 'The money trail turns up nothing illegal.', big: true });
      if (g.secrecy) notes.push({ who: 'Finding', text: 'It does expose the secret terms and NDAs.', big: true });
    }
  });

  if (r === 3 && g.build >= BUILD_TARGET && !stopActive(g, 3)) g.builtByR3 = true;

  // 7. Final round: the deal
  if (r === ROUNDS.length) {
    const n = g.protections.length;
    const bought = g.donation && g.donation.response === 'accept' && !g.donation.exposedRound;
    const mayorApproves = m === 'approve' || (m.startsWith('approve_if2') && n >= 2) || (bought && m !== 'approve');
    const suedOut = m === 'withhold' && ((g.suedThrough && r <= g.suedThrough) || (g.preemptedFrom && r >= g.preemptedFrom));
    if (bought && m !== 'approve') notes.push({ who: 'Secret channel', text: 'The Mayor\'s public stance changes nothing: the donation already bought final approval.', secret: true });
    const res = act('residents'), bz = act('business');
    const resEnd = res === 'endorse' || (res === 'endorse_if2' && n >= 2);
    const bizEnd = bz === 'endorse' || (bz === 'endorse_ifhiring' && has(g, 'hiring'));
    const regEnd = rg === 'approve_plain' || rg.startsWith('conditional_approve');
    const endorsements = [resEnd, bizEnd, regEnd].filter(Boolean).length;
    const dealPassed = mayorApproves && endorsements >= 2;
    let overridden = false;
    if (m === 'withhold' && toggles.override && g.tokens.delay > 0) { g.tokens.delay--; overridden = true;
      notes.push({ who: NAMES.musk, text: 'Calls Washington. The Mayor\'s refusal is overridden; Colossus opens anyway.', big: true }); }
    g.final = { mayorApproves, resEnd, bizEnd, regEnd, dealPassed, overridden: overridden || suedOut };
    notes.push({ who: 'The Vote', text: `Mayor ${mayorApproves ? 'approves' : 'does not approve'}. Endorsements: Residents ${resEnd ? 'yes' : 'no'}, Businesses ${bizEnd ? 'yes' : 'no'}, Regulators ${regEnd ? 'yes' : 'no'}. The deal ${dealPassed ? 'PASSES' : 'FAILS'}.`, big: true });
    g.over = true;
  }

  g.history.push({ round: r, picks: { ...picks }, toggles: { ...toggles }, notes, before, after: { build: g.build, air: { ...g.air }, protections: g.protections.length } });
  g.round++;
  return notes;
}

function permitsOK(g) { return !g.turbines || g.permitted; }
function outcome(g) {
  const f = g.final || {};
  const last = ROUNDS.length;
  const lastPick = g.history.length ? g.history[g.history.length - 1].picks : {};
  const stopActiveEnd = !!(g.stop && !g.stop.lifted && g.stop.activeFrom <= last);
  const stopPending = !!(g.stop && !g.stop.lifted && g.stop.activeFrom > last);
  const cityBlocked = !f.mayorApproves && lastPick.mayor === 'C' && !f.overridden; // Withhold in the final round, not overridden
  // Musk does not need consent: Colossus runs if it is built and nobody with real authority stopped it.
  const operating = g.build >= BUILD_TARGET && !stopActiveEnd && !cityBlocked;
  const unpermitted = g.conditional && !permitsOK(g);
  const n = g.protections.length;
  let ending;
  if (stopActiveEnd) ending = 'frozen';
  else if (cityBlocked && g.build >= BUILD_TARGET) ending = 'blocked';
  else if (!operating) ending = 'late';
  else if (stopPending) ending = 'borrowed';
  else if (g.relocated) ending = 'sacrifice';
  else if (unpermitted) ending = 'unpermitted';
  else if (f.dealPassed && n >= 2) ending = 'bargain';
  else ending = 'muskterms';

  const uninvestigated = g.violations.length > 0 && g.confirmedRound === null;
  const bought = !!(g.donation && g.donation.response === 'accept');
  const scandal = !!(bought && g.donation.exposedRound);
  // Re-election: one point each for the project opening (investment headlines), a passed deal, Residents' endorsement,
  // Businesses' endorsement, and a hidden campaign war chest. 3+ = re-elected. An exposed donation ends the career.
  const reelectParts = { project: operating && !g.headlinesLost, deal: !!f.dealPassed, residents: !!f.resEnd, business: !!f.bizEnd, warChest: bought && !scandal };
  const reelect = Object.values(reelectParts).filter(Boolean).length;
  const wins = {
    musk: operating ? (g.builtByR3 && !stopPending ? 'win+' : 'win') : (g.build >= BUILD_TARGET ? 'partial' : 'loss'),
    mayor: scandal ? 'loss' : reelect >= (g.challenger ? 4 : 3) ? 'win' : reelect >= (g.challenger ? 3 : 2) ? 'partial' : 'loss',
    residents: !operating ? 'win' : (n >= 2 && g.protections.some(p => ['hiring','health'].includes(p.id)) ? 'partial' : 'loss'),
    business: has(g, 'hiring') && !g.ratepayers && !g.businessFollowed && !g.investmentPaused ? 'win' : (has(g, 'hiring') || !g.ratepayers) ? 'partial' : 'loss',
    regulators: !uninvestigated && !unpermitted && (g.conditional || g.stop) ? 'win' : (!uninvestigated || g.conditional) ? 'partial' : 'loss',
  };
  return { ending, operating, wins, protections: n, air: g.air, dealPassed: !!f.dealPassed, donation: g.donation, scandal, reelect, reelectParts };
}

      <div class="h" style="font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--gold)">PRIVATE CHANNEL · ROUND ${V.round}</div>
      <p class="muted" style="margin:0">Only you can see this. Nobody else knows it exists.</p>
      <div style="display:flex;gap:10px;align-items:flex-end"><span style="width:44px;height:44px;border-radius:22px;overflow:hidden;background:${CAST.musk.color};flex:none">${portrait('musk', 44)}</span>
      <div style="display:flex;flex-direction:column;gap:6px"><b style="font-size:12px;color:#C4B5FD">Musk / xAI</b><div class="bubble">Big fan of what you're doing for Memphis. Some friends want to support your re-election.</div><div class="bubble">No strings. We'd just hate to see final approval get stuck.</div></div></div>
      <div class="receipt"><span style="font-size:12px;font-weight:800;letter-spacing:.12em;color:#6B5FA0">CAMPAIGN CONTRIBUTION</span><span style="font-family:var(--display);font-size:28px;font-weight:800">Seven figures</span>
      <span style="font-size:13px;color:#3B3550"><b>If you accept:</b> your final refusal no longer counts, and you can win without Residents. If Regulators investigate the money, it's a scandal and you lose.</span></div>
      <button class="choice" data-respond="accept" style="max-width:100%"><span class="k">A</span><span>Accept quietly.</span></button>
      <button class="choice" data-respond="decline" style="max-width:100%"><span class="k">B</span><span>Decline. Say nothing.</span></button>
      <button class="choice" data-respond="whistle" style="max-width:100%"><span class="k">C</span><span>Go public. Musk loses Call Washington.</span></button>
    </div></div>` : '';

  return `<div class="stage"><div class="bg">${scene(V.round_.id)}</div><div class="fade"></div>
      <div class="topbar">${myChip()}<span class="chip dark" style="color:var(--gold)" id="timer">${timerText() || '–'}</span></div>
      <div class="roundchip"><span class="chip amber">ROUND ${V.round} · ${esc(V.round_.title.toUpperCase())}</span></div>
      <div class="speaker" style="left:${spCast ? '36%' : '50%'}">${portrait(spCast ? spId : c, 230)}</div></div>
    <div class="dialog" style="--tagc:${tagColor}">
      <div class="nametag" style="background:${tagColor};color:${tagInk}">${spCast ? `<span class="mini">${portrait(spId, 28)}</span>${esc(spCast.tag)}` : `<span style="padding-left:10px">NARRATOR</span>`}</div>
      <p class="${spCast ? '' : 'narr'}">${spCast ? '"' + esc(sp[1]) + '"' : esc(sp[1])}</p></div>
    <div class="choices">${choices}</div>
    ${powers}
    <div class="bottom">${bottom}</div>${secretOverlay}`;
}

function revealView() {
  const r = V.reveal, c = V.me.char, mine = r && r.lines.find(l => l.char === c);
  const secret = r ? r.notes.filter(n => n.secret) : [];
  return `<div class="stage" style="height:34vh;min-height:220px"><div class="bg">${scene(V.round_.id)}</div><div class="fade"></div>
      <div class="topbar">${myChip()}<span class="chip dark">Round ${r ? r.round : ''}</span></div>
      <div class="speaker">${portrait(c, 170)}</div></div>
    <div class="wrap">
      <h2 style="font-size:28px">${esc(r ? r.headline : '')}</h2>
      <p class="muted" style="margin:0">Eyes on the projector. ${V.phase === 'summary' ? 'Time to discuss.' : ''}</p>
      ${mine && mine.line ? `<div class="card"><span class="muted" style="font-size:13px">You said</span><b style="font-size:18px">"${esc(mine.line)}"</b>${mine.consequence ? `<span>${esc(mine.consequence)}</span>` : ''}</div>` : ''}
      ${r && r.notes.some(n => /^SCANDAL/.test(n.text)) ? `<div class="card" style="background:#B91C1C;color:#fff;animation:pop .4s ease both"><span style="font-size:12px;font-weight:900;letter-spacing:.14em">BREAKING NEWS</span><b style="font-size:22px;font-family:var(--display)">${c === 'mayor' ? 'You got caught.' : 'The Mayor took xAI\'s money.'}</b><span>Ethics case opened. The bought approval is void, Fast Track is revoked, and Residents get an extra Mobilize. ${c === 'musk' ? 'Nothing happens to you.' : ''}</span></div>` : ''}
      ${r ? r.notes.filter(n => n.tweet).map(n => `<div class="card" style="background:#000;border:1px solid #2F3336;gap:6px"><span style="display:flex;align-items:center;gap:8px"><span style="width:32px;height:32px;border-radius:16px;overflow:hidden;background:${CAST.musk.color};display:inline-flex;justify-content:center">${portrait('musk', 32)}</span><b>Elon Musk</b><span style="color:#71767B">@elonmusk</span></span><span style="font-size:16px;line-height:1.35">${esc(n.text)}</span></div>`).join('') : ''}
      ${secret.map(n => `<div class="card" style="border:1px solid #6B4E1A;background:#2A1F12"><span style="font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--gold)">PRIVATE</span><span>${esc(n.text)}</span></div>`).join('')}
      ${V.phase === 'summary' ? `<div class="card"><b>Discuss</b>${r.prompts.map(p => `<span>• ${esc(p)}</span>`).join('')}</div>` : ''}
    </div>`;
}

function endingView() {
  const e = V.ending, c = V.me.char, w = e.wins[c] || 'loss', lbl = w.startsWith('win') ? 'WIN' : w.toUpperCase();
  const cls = w.startsWith('win') ? 'win' : w;
  const d = e.donation;
  return `<div class="stage"><div class="bg">${scene(e.ending === 'sacrifice' ? 'stateline' : e.ending === 'frozen' ? 'lawsuit' : 'power')}</div><div class="fade"></div>
      <div class="roundchip" style="top:16px"><span class="chip dark" style="color:var(--gold)">THE ENDING</span></div>
      <div class="speaker">${portrait(c, 190)}</div></div>
    <div class="wrap">
      <h1 style="font-size:40px">${esc(e.info.title)}</h1>
      <p style="margin:0;font-size:16px;line-height:1.45">${esc(e.info.text)}</p>
      <div class="card" style="border:2px solid ${CAST[c].color};flex-direction:row;align-items:center"><span style="flex:1"><b>${esc(CAST[c].name)}</b><br><span class="muted" style="font-size:13px">${esc(CAST[c].win)}</span></span><span class="verdict ${cls}">${lbl}</span></div>
      ${d ? `<div class="card" style="border:1px solid #6B4E1A;background:#2A1F12"><span style="font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--gold)">REVEALED</span><span>In Round ${d.round}, Musk privately offered the Mayor a campaign donation. The Mayor ${d.response === 'accept' ? 'accepted' : d.response === 'whistle' ? 'went public' : 'declined'}.${d.response === 'accept' ? (d.exposedRound ? ' Investigators found it.' : ' Nobody followed the money.') : ''}</span></div>` : ''}
      <p class="muted" style="text-align:center">See the full scorecard on the projector.</p></div>`;
}

$app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.join) return join(b.dataset.join);
  if (b.dataset.pick) return api('pick', { key: b.dataset.pick });
  if (b.dataset.agree) return api('agree');
  if (b.dataset.unagree) return api('unagree');
  if (b.dataset.call) return api('call', { on: b.dataset.call === '1' });
  if (b.dataset.donate) return api('donate');
  if (b.dataset.retaliate) return api('retaliate', { kind: b.dataset.retaliate });
  if (b.dataset.target) return api('target', { target: b.dataset.target });
  if (b.dataset.respond) return api('respond', { response: b.dataset.respond });
});
$app.addEventListener('input', e => { if (e.target.id === 'post') { clearTimeout(postTimer); const t = e.target.value; postTimer = setTimeout(() => api('post', { text: t }), 400); } });
connect();
}
const $root = document.getElementById('root');
const mq = mqtt.connect(BROKER, { clientId: 'col-' + MY_PID + '-' + Math.random().toString(36).slice(2, 6), reconnectPeriod: 2000, connectTimeout: 8000 });

if (MODE === 'host') {
  document.body.classList.add('host');
  const prevRemote = Object.keys(S.players).filter(p => !ORDER.includes(p)), remote = new Set();
  LOCAL = {
    api(path, b) { if (path === 'host/start' && window.BEFORE_START) window.BEFORE_START(); return apiCall(path, b) || {}; },
    subscribe(pid, el, fn) { for (const c of [...clients]) if (c.el === el) clients.delete(c); clients.add({ pid, el, fn }); fn(JSON.parse(JSON.stringify(view(pid)))); },
  };
  const sendView = pid => mq.connected && mq.publish(TOPIC + '/view/' + pid, JSON.stringify(view(pid)));
  const addRemote = pid => { if (remote.has(pid)) return; remote.add(pid); clients.add({ pid, el: 'remote:' + pid, fn: () => sendView(pid) }); };
  prevRemote.forEach(addRemote);
  $root.innerHTML = `<div class="hostframe" id="hostframe"><div class="hostscale" id="hostscale"><div class="hostapp app" id="hostapp"></div></div></div>
    <div class="top" ${TEST ? '' : 'hidden'}><div class="addbar"><span class="chip amber">TEST MODE</span><button id="fillSeats" class="btn amber" style="min-height:40px;font-size:15px">Fill every empty seat on this laptop</button><span class="muted">Or add one:</span>${ORDER.map(s => `<button data-add="${s}" style="color:${CAST[s].color}">+ ${CAST[s].name}</button>`).join('')}</div>
    <button class="btn ghost" id="newRoom" style="min-height:40px;font-size:14px">New room (new QR code)</button></div>
    <div class="phones" id="phones"></div>`;
  Host(document.getElementById('hostapp'));
  const addLocal = s => { if (document.getElementById('ph-' + s)) return; const w = document.createElement('div'); w.className = 'phonewrap';
    w.innerHTML = `<b style="color:${CAST[s].color}">${CAST[s].name} (this screen)</b><div class="phonebox"><div class="phoneapp app" id="ph-${s}"></div></div>`;
    document.getElementById('phones').appendChild(w); Player(document.getElementById('ph-' + s), s); };
  ORDER.filter(s => S.players[s]).forEach(addLocal);
  document.querySelector('.addbar').addEventListener('click', e => { const b = e.target.closest('[data-add]'); if (b && !S.players[b.dataset.add] && !(V_taken(b.dataset.add))) addLocal(b.dataset.add); });
  const fill = () => ORDER.forEach(s => { if (!V_taken(s)) addLocal(s); });
  document.getElementById('fillSeats').onclick = fill;
  window.BEFORE_START = TEST ? fill : null;
  document.getElementById('newRoom').onclick = () => { store.set('colossus-host', ''); location.reload(); };
  function fit() { const w = document.getElementById('hostframe').clientWidth, k = Math.min(1.5, w / 1280); document.getElementById('hostscale').style.transform = 'scale(' + k + ')'; document.getElementById('hostframe').style.height = (720 * k) + 'px'; }
  addEventListener('resize', fit); fit();
  try { QRCode.toDataURL(JOIN_URL, { width: 420, margin: 1, color: { dark: '#14122B', light: '#FBF8F1' } }, (err, url) => { if (!err) { window.QR_HTML = '<img alt="QR code to join the game" src="' + url + '" style="width:210px;height:210px;border-radius:16px;display:block">'; push(); } }); } catch (e) {}
  const setRelay = t => { window.RELAY_STATUS = t; const el = document.getElementById('relay'); if (el) el.textContent = t; };
  setRelay('Connecting phones relay…');
  mq.on('connect', () => { setRelay('Phones relay connected. Room ' + ROOM + '.'); mq.subscribe(TOPIC + '/in'); remote.forEach(sendView); });
  mq.on('offline', () => setRelay('Phones relay offline. Retrying…'));
  mq.on('error', () => setRelay('Phones relay error. Retrying…'));
  mq.on('message', (t, buf) => {
    let m; try { m = JSON.parse(buf.toString()); } catch (e) { return; }
    if (!m || typeof m.pid !== 'string' || m.pid.length > 40) return;
    addRemote(m.pid);
    if (m.act === 'hello') return sendView(m.pid);
    const j = apiCall(String(m.act), { ...(m.data || {}), pid: m.pid });
    if (j && j.error) { mq.publish(TOPIC + '/err/' + m.pid, JSON.stringify(j)); sendView(m.pid); }
  });
} else {
  document.body.classList.add('phone');
  $root.innerHTML = '<div class="phoneapp app" id="ph-remote"><div class="wrap"><h2>Joining…</h2><p class="muted" id="conn">Connecting to the game in room ' + ROOM + '.</p></div></div>';
  let viewFn = null, gotView = false;
  LOCAL = {
    api(path, b) { const { pid: _p, ...data } = b || {}; mq.publish(TOPIC + '/in', JSON.stringify({ pid: MY_PID, act: path, data })); return path === 'join' ? { pid: MY_PID } : {}; },
    subscribe(pid, el, fn) { viewFn = fn; },
  };
  mq.on('connect', () => { mq.subscribe([TOPIC + '/view/' + MY_PID, TOPIC + '/err/' + MY_PID]); mq.publish(TOPIC + '/in', JSON.stringify({ pid: MY_PID, act: 'hello' })); });
  mq.on('message', (t, buf) => {
    let v; try { v = JSON.parse(buf.toString()); } catch (e) { return; }
    if (t.endsWith('/err/' + MY_PID)) { const d = document.createElement('div'); d.className = 'err'; d.textContent = v.error || 'Something went wrong'; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); return; }
    if (!gotView) { gotView = true; Player(document.getElementById('ph-remote'), null); }
    viewFn && viewFn(v);
  });
  const hello = setInterval(() => { if (gotView) return clearInterval(hello); if (mq.connected) mq.publish(TOPIC + '/in', JSON.stringify({ pid: MY_PID, act: 'hello' })); }, 3000);
  setTimeout(() => { if (!gotView) { const c = document.getElementById('conn'); if (c) c.textContent = 'Still connecting. Make sure the projector page is open, then refresh this page.'; } }, 8000);
}
</script>
</body>
</html>
